
name: Test

on: [
  workflow_dispatch
]

jobs:
  build:
    timeout-minutes: 40
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [24.x, 16.x, 17.x, 18.x, 19.x, 20.x]
        include:
          - os: macos-latest
            node-version: 16.x
          - os: macos-latest
            node-version: 18.x
          - os: macos-latest
            node-version: 20.x
          - os: windows-latest
            node-version: 16.x
          - os: windows-latest
            node-version: 18.x
          - os: windows-latest
            node-version: 20.x

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: node test/ci.js
      - name: Pack
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
        run: |
          npm i -g npm@11.13.0
          npm pack
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
        with:
          name: systeminformation-tgz
          path: systeminformation-*.tgz
          if-no-files-found: error
